name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Create fresh Android project
        run: |
          npm install --no-save --legacy-peer-deps "@capacitor/cli@^8" "@capacitor/android@^8"
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/sharkboost/app
          cp native/SharkBoostPlugin.kt android/app/src/main/java/com/sharkboost/app/
          cp native/strings.xml android/app/src/main/res/values/strings.xml
          cat > android/app/src/main/java/com/sharkboost/app/MainActivity.java <<'JAVA'
          package com.sharkboost.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SharkBoostPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Enable Kotlin
        run: |
          cd android
          grep -q "kotlin-gradle-plugin" build.gradle || sed -i "/dependencies {/a\        classpath 'org.jetbrains.kotlin:gradle-plugin:2.1.0'" build.gradle
          grep -q "kotlin-android" app/build.gradle || sed -i "/apply plugin: 'com.android.application'/a apply plugin: 'kotlin-android'" app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gamemind-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
