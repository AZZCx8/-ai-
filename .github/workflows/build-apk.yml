name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and build web app
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm install
          npm run build

      - name: Create fresh Android project
        run: |
          npm install --no-save "@capacitor/cli@^8" "@capacitor/android@^8"
          rm -rf android
          npx cap add android
          mkdir -p android/app/src/main/java/com/sharkboost/app
          cp native/SharkBoostPlugin.kt android/app/src/main/java/com/sharkboost/app/
          cp native/strings.xml android/app/src/main/res/values/strings.xml
          cat > android/app/src/main/java/com/sharkboost/app/MainActivity.java <<'JAVA'
          package com.sharkboost.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SharkBoostPlugin.class);
                  super.onCreate(savedInstanceStat
